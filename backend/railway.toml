# =============================================================================
# Railway deployment configuration — CareerAgent Backend
# Docs: https://docs.railway.com/reference/config-as-code
# =============================================================================

[build]
# Use the Dockerfile in this directory
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects $PORT automatically; uvicorn picks it up via CMD
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --log-level info --access-log"

# Restart policy: restart on failure, up to 10 times
restartPolicyType  = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Health check — Railway will only route traffic once this passes
healthcheckPath    = "/health"
healthcheckTimeout = 300        # seconds to wait on first deploy
