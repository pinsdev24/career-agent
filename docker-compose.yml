services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--protected-mode", "no", "--bind", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  careeragent-api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      REQUIRE_REDIS: "true"
      REQUIRE_POSTGRES_CHECKPOINTER: "true"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      redis:
        condition: service_healthy

  careeragent-worker:
    build: ./backend
    command: arq app.workers.settings.WorkerSettings
    healthcheck:
      disable: true
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      REQUIRE_REDIS: "true"
      REQUIRE_POSTGRES_CHECKPOINTER: "true"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      redis:
        condition: service_healthy

  job-engine-api:
    build: ./job-engine
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    env_file:
      - ./job-engine/.env
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./job-engine/app:/app/app
      - ./job-engine/companies.seed.yaml:/app/companies.seed.yaml
    depends_on:
      redis:
        condition: service_healthy

  job-engine-worker:
    build: ./job-engine
    command: arq app.workers.settings.WorkerSettings
    healthcheck:
      disable: true
    env_file:
      - ./job-engine/.env
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./job-engine/app:/app/app
      - ./job-engine/companies.seed.yaml:/app/companies.seed.yaml
    depends_on:
      redis:
        condition: service_healthy
