[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "job-engine"
version = "0.1.0"
description = "MACA Job Engine — personalized job catalog and recommendations"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.2",
    "uvicorn[standard]==0.42.0",
    "pydantic-settings==2.13.1",
    "supabase==2.28.3",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "arq>=0.26.1",
    "redis>=5.2.0",
    "openai>=1.60.0",
    "tavily-python==0.7.23",
    "structlog>=25.1.0",
    "prometheus-client>=0.21.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
]
